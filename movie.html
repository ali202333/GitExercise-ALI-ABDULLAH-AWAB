<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Movie | S-CoreBox</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 32px;
			background: #f5f5f5;
			color: #222;
		}

		.movie-page {
			width: min(100%, 760px);
			margin: 8vh auto 0;
		}

		.brand {
			margin: 0 0 28px;
			font-size: 1.1rem;
			font-weight: bold;
		}

		.movie-panel {
			padding: 42px;
			border: 1px solid #d2d2d2;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 16px 36px rgb(0 0 0 / 8%);
		}

		.movie-label {
			margin: 0 0 12px;
			color: #666;
			font-size: 0.75rem;
			font-weight: bold;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0 0 28px;
			font-size: clamp(2rem, 5vw, 3.5rem);
			line-height: 1.1;
		}

		.movie-rating {
			margin: 0 0 28px;
			font-size: 1.15rem;
			font-weight: bold;
		}

		.movie-rating span {
			color: #d48b22;
		}

		.movie-section {
			padding-top: 22px;
			border-top: 1px solid #e5e5e5;
		}

		.movie-section h2 {
			margin: 0 0 10px;
			font-size: 1rem;
		}

		.movie-genres {
			margin: 0;
			color: #555;
			line-height: 1.7;
		}

		.imdb-link {
			display: inline-block;
			margin-top: 22px;
			color: #222;
			word-break: break-all;
		}

		.back-link {
			display: inline-block;
			margin-top: 28px;
			padding: 11px 18px;
			border: 1px solid #222;
			border-radius: 6px;
			background: #222;
			color: #ffffff;
			text-decoration: none;
		}

		.back-link:hover,
		.back-link:focus-visible {
			background: #444;
		}

		#error-message[hidden],
		#movie-content[hidden] {
			display: none;
		}

		@media (max-width: 520px) {
			body {
				padding: 20px;
			}

			.movie-page {
				margin-top: 4vh;
			}

			.movie-panel {
				padding: 28px 22px;
			}
		}
	</style>
</head>
<body>
	<main class="movie-page">
		<p class="brand">S-CoreBox</p>
		<section id="movie-content" class="movie-panel" aria-labelledby="movie-title" hidden>
			<p class="movie-label">Movie details</p>
			<h1 id="movie-title"></h1>
			<p class="movie-rating"><span>★</span> <span id="movie-rating"></span> / 10</p>

			<div class="movie-section">
				<h2>Genres</h2>
				<p id="movie-genres" class="movie-genres"></p>
				<a id="imdb-link" class="imdb-link" target="_blank" rel="noopener noreferrer">View on IMDb</a>
			</div>

			<a class="back-link" href="proto2.html">Back to S-CoreBox</a>
		</section>
		<p id="error-message" role="alert" hidden></p>
	</main>

	<script>
		const movieContent = document.getElementById('movie-content');
		const errorMessage = document.getElementById('error-message');
		const movieId = new URLSearchParams(window.location.search).get('id');

		fetch('output.json')
			.then((response) => {
				if (!response.ok) {
					throw new Error('Unable to load the movie catalog.');
				}
				return response.json();
			})
			.then((movies) => {
				const movie = movies.find((item) => String(item.id) === movieId);
				if (!movie) {
					throw new Error('Movie not found.');
				}

				document.title = `${movie.title} | S-CoreBox`;
				document.getElementById('movie-title').textContent = movie.title;
				document.getElementById('movie-rating').textContent = movie.rating;
				document.getElementById('movie-genres').textContent = movie.genres.join(', ');
				document.getElementById('imdb-link').href = movie.movie_url;
				movieContent.hidden = false;
			})
			.catch((error) => {
				errorMessage.textContent = error.message;
				errorMessage.hidden = false;
			});
	</script>
</body>
</html>
