<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>S-CoreBox</title>
	<style>
		body {
			margin: 0;
			background: #ffffff;
			color: #222;
			font-family: Arial, sans-serif;
		}

		.brand {
			position: absolute;
			top: 20px;
			right: 24px;
			font-size: 1.25rem;
			font-weight: bold;
		}

		.account-actions {
			position: absolute;
			top: 58px;
			right: 24px;
			display: flex;
			gap: 8px;
		}

		.sign-in-button,
		.sign-up-button {
			padding: 10px 18px;
			border: 1px solid #cfcfcf;
			border-radius: 6px;
			background: #ffffff;
			color: #222;
			font: inherit;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
		}

		.sign-in-button:hover,
		.sign-in-button:focus-visible,
		.sign-up-button:hover,
		.sign-up-button:focus-visible {
			border-color: #222;
			background: #dedede;
		}

		header {
			padding: 80px 24px 24px;
			border-bottom: 1px solid #e5e5e5;
		}

		main {
			width: 75%;
			min-height: calc(100vh - 151px);
			padding: 32px 24px;
			box-sizing: border-box;
		}

		.main-actions {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 12px;
			margin-bottom: 32px;
		}

		.filter-control {
			display: block;
			min-width: 0;
		}

		.main-actions select,
		.main-actions > button,
		.search-bar {
			flex: 1 1 0;
			min-width: 0;
			padding: 12px 20px;
			box-sizing: border-box;
			border: 1px solid #cfcfcf;
			border-radius: 6px;
			background: #ffffff;
			color: #222;
			font: inherit;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
		}

		.main-actions select {
			width: 100%;
			flex: 0 0 auto;
			text-align: center;
		}

		.search-bar {
			grid-column: 1 / -1;
			width: 100%;
			flex: 0 0 auto;
			cursor: text;
		}

		.search-wrapper {
			position: relative;
			grid-column: 1 / -1;
		}

		.main-actions select option {
			text-align: center;
		}

		.main-actions select:hover,
		.main-actions select:focus-visible,
		.main-actions > button:hover,
		.main-actions > button:focus-visible,
		.search-bar:hover,
		.search-bar:focus-visible {
			border-color: #222;
		}

		.main-actions select:hover {
			background: #dedede;
		}

		.main-actions button[aria-pressed="true"] {
			border-color: #222;
			background: #222;
			color: #ffffff;
		}

		.mock-data-box {
			max-height: 360px;
			overflow-y: auto;
			border: 1px solid #cfcfcf;
			border-radius: 6px;
		}

		.movie-row {
			display: flex;
			align-items: stretch;
			border-bottom: 1px solid #e5e5e5;
		}

		.movie-button {
			flex: 1;
			padding: 16px 20px;
			border: 0;
			background: #ffffff;
			color: #222;
			font: inherit;
			font-weight: bold;
			text-align: left;
			cursor: pointer;
			transition: background-color 160ms ease;
		}

		.bookmark-button {
			width: 110px;
			padding: 12px;
			border: 0;
			border-left: 1px solid #e5e5e5;
			background: #ffffff;
			color: #222;
			font: inherit;
			cursor: pointer;
		}

		.bookmark-button:hover,
		.bookmark-button:focus-visible,
		.bookmark-button[aria-pressed="true"] {
			background: #dedede;
		}

		.movie-button:hover,
		.movie-button:focus-visible {
			background: #dedede;
		}

		.movie-button[hidden] {
			display: none;
		}

		.movie-row[hidden] {
			display: none !important;
		}

		.movie-row:last-child {
			border-bottom: 0;
		}
	</style>
</head>
<body>
	<div class="brand"></div>
	<nav class="account-actions" aria-label="Account actions">
		<a class="sign-in-button" href="signin.html">Sign In</a>
		<a class="sign-up-button" href="signup.html">Sign Up</a>
	</nav>

	<header>
		<h1>S-CoreBox</h1>
	</header>

	<main>
		<div class="main-actions" role="group" aria-label="Content controls">
			<div class="filter-control">
				<select aria-label="Filter">
					<option value="all">Filter</option>
					<option value="recent">Recent</option>
					<option value="unread">Unread</option>
					<option value="favorites">Favorites</option>
				</select>
			</div>
			<button type="button" aria-pressed="false" data-sort-direction="sort">Sort</button>
			<button type="button" aria-pressed="false" data-bookmarks-filter>Bookmarks</button>
			<div class="search-wrapper">
				<input class="search-bar" type="search" aria-label="Search movies" aria-controls="mock-data-box" placeholder="Search movies...">
			</div>
		</div>

		<div id="mock-data-box" class="mock-data-box" aria-label="Mock movie data"></div>
	</main>

	<script>
		const mockDataBox = document.getElementById('mock-data-box');

		for (let movieNumber = 1; movieNumber <= 100; movieNumber += 1) {
			const movieRow = document.createElement('div');
			movieRow.className = 'movie-row';

			const movieButton = document.createElement('button');
			movieButton.type = 'button';
			movieButton.className = 'movie-button';
			movieButton.textContent = `Movie #${movieNumber}`;

			const bookmarkButton = document.createElement('button');
			bookmarkButton.type = 'button';
			bookmarkButton.className = 'bookmark-button';
			bookmarkButton.setAttribute('aria-pressed', 'false');
			bookmarkButton.textContent = 'Bookmark';
			bookmarkButton.addEventListener('click', () => {
				const isBookmarked = bookmarkButton.getAttribute('aria-pressed') === 'true';
				bookmarkButton.setAttribute('aria-pressed', String(!isBookmarked));
				bookmarkButton.textContent = isBookmarked ? 'Bookmark' : 'Bookmarked';
				filterMovies(searchBar.value);
			});

			movieRow.append(movieButton, bookmarkButton);
			mockDataBox.appendChild(movieRow);
		}

		const movieRows = [...mockDataBox.querySelectorAll('.movie-row')];
		const searchBar = document.querySelector('.search-bar');
		const bookmarksFilterButton = document.querySelector('[data-bookmarks-filter]');

		const sortMovies = (direction) => {
			const sortedRows = [...movieRows].sort((firstRow, secondRow) => {
				const firstNumber = Number(firstRow.querySelector('.movie-button').textContent.replace(/\D/g, ''));
				const secondNumber = Number(secondRow.querySelector('.movie-button').textContent.replace(/\D/g, ''));
				return direction === 'ascending' ? firstNumber - secondNumber : secondNumber - firstNumber;
			});

			sortedRows.forEach((movieRow) => mockDataBox.appendChild(movieRow));
		};

		const filterMovies = (searchTerm) => {
			const normalizedSearchTerm = searchTerm.trim().toLowerCase();
			const bookmarksOnly = bookmarksFilterButton.getAttribute('aria-pressed') === 'true';

			movieRows.forEach((movieRow) => {
				const movieTitle = movieRow.querySelector('.movie-button').textContent.trim().toLowerCase();
				const matchesSearch = movieTitle.includes(normalizedSearchTerm);
				const isBookmarked = movieRow.querySelector('.bookmark-button').getAttribute('aria-pressed') === 'true';
				movieRow.hidden = !matchesSearch || (bookmarksOnly && !isBookmarked);
			});
		};

		searchBar.addEventListener('input', () => filterMovies(searchBar.value));

		document.querySelectorAll('.main-actions button').forEach((button) => {
			button.addEventListener('click', () => {
				if (button.dataset.sortDirection) {
					if (button.dataset.sortDirection === 'sort') {
						button.dataset.sortDirection = 'ascending';
						button.setAttribute('aria-pressed', 'true');
						button.textContent = 'Ascending ↑';
						sortMovies('ascending');
						return;
					}

					const isAscending = button.dataset.sortDirection === 'ascending';
					const nextDirection = isAscending ? 'descending' : 'ascending';
					button.dataset.sortDirection = nextDirection;
					button.textContent = isAscending ? 'Descending ↓' : 'Ascending ↑';
					sortMovies(nextDirection);
					return;
				}

				const isSelected = button.getAttribute('aria-pressed') === 'true';
				button.setAttribute('aria-pressed', String(!isSelected));

				if (button === bookmarksFilterButton) {
					filterMovies(searchBar.value);
				}
			});
		});
	</script>
</body>
</html>
