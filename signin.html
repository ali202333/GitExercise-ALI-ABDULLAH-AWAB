<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>S-CoreBox</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Arial, sans-serif;
			--bg: #050505;
			--panel: #121212;
			--text: #f5f5f5;
			--muted: #cfcfcf;
			--border: rgba(255, 255, 255, 0.12);
			--theme-frame-image: url("console.png");
			--frame-top: 5vh;
			--frame-right: 16vw;
			--frame-bottom: 5vh;
			--frame-left: 16vw;
		}

		body {
			box-sizing: border-box;
			min-height: 100vh;
			margin: 0;
			padding: var(--frame-top) var(--frame-right) var(--frame-bottom) var(--frame-left);
			background: var(--bg);
			color: var(--text);
		}

		body[data-theme="light"] {
			color-scheme: light;
			--bg: #f5f5f5;
			--panel: #ffffff;
			--text: #111111;
			--muted: #555555;
			--border: rgba(17, 17, 17, 0.38);
			--theme-frame-image: url("tbdf.png");
			--frame-right: 16vw;
			--frame-left: 16vw;
		}

		body::before {
			position: fixed;
			z-index: 2;
			inset: 0;
			background: var(--theme-frame-image) center / 100% 100% no-repeat;
			content: "";
			pointer-events: none;
		}

		body[data-theme="light"]::before {
			z-index: 2;
			opacity: 0.9;
		}

		body > * {
			position: relative;
			z-index: 1;
		}

		.sign-in-page {
			display: flex;
			min-height: calc(100vh - 48px);
			align-items: center;
			justify-content: center;
		}

		.theme-toggle {
			margin-bottom: 18px;
			padding: 9px 14px;
			border: 1px solid var(--border);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.04);
			color: var(--text);
			font: inherit;
			cursor: pointer;
		}

		.sign-in-panel {
			width: min(100%, 420px);
			box-sizing: border-box;
			padding: 36px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--panel);
			box-shadow: 0 12px 30px rgb(0 0 0 / 8%);
		}

		.loading-screen {
			position: fixed;
			z-index: 10;
			inset: 0;
			display: grid;
			place-items: center;
			background: #ffffff;
			color: #111111;
			opacity: 0;
			pointer-events: none;
			transition: opacity 160ms ease;
		}

		.loading-screen[aria-hidden="false"] { opacity: 1; pointer-events: auto; }

		.loading-gif {
			width: min(260px, 40vw);
			height: auto;
			object-fit: contain;
		}

		.brand {
			margin: 0 0 8px;
			font-size: 1.25rem;
			font-weight: bold;
		}

		.logo-mark {
			display: inline-block;
			width: 72px;
			height: 72px;
			margin-left: 10px;
			vertical-align: middle;
			object-fit: contain;
		}

		.logo-dark { display: inline-block; mix-blend-mode: screen; }
		.logo-light { display: none; mix-blend-mode: multiply; }
		.random-movie-logo {
			color: inherit;
			text-decoration: none;
		}
		body[data-theme="light"] .logo-dark { display: none; }
		body[data-theme="light"] .logo-light { display: inline-block; }

		h1 {
			margin: 0 0 8px;
			font-size: 2rem;
		}

		.subtitle {
			margin: 0 0 28px;
			color: #666;
		}

		.form-field {
			display: block;
			margin-bottom: 18px;
			font-weight: bold;
		}

		input {
			display: block;
			width: 100%;
			box-sizing: border-box;
			margin-top: 8px;
			padding: 12px 14px;
			border: 1px solid var(--border);
			border-radius: 6px;
			font: inherit;
		}

		input:focus-visible {
			outline: 2px solid #222;
			outline-offset: 2px;
		}

		.submit-button {
			width: 100%;
			margin-top: 6px;
			padding: 12px 20px;
			border: 1px solid #000000;
			border-radius: 6px;
			background: #000000;
			color: #ffffff;
			font: inherit;
			font-weight: bold;
			cursor: pointer;
		}

		.submit-button:hover,
		.submit-button:focus-visible {
			background: #111111;
		}

		.back-link {
			display: block;
			margin-top: 24px;
			color: #222;
			text-align: center;
		}

		button {
			min-height: 52px;
			box-sizing: border-box;
		}

		@media (max-width: 480px) {
			body {
				padding: var(--frame-top) var(--frame-right) var(--frame-bottom) var(--frame-left);
			}

			.sign-in-page {
				min-height: calc(100vh - var(--frame-top) - var(--frame-bottom));
			}

			.sign-in-panel {
				padding: 28px 22px;
			}
		}
	</style>
</head>
<body>
	<div class="loading-screen" aria-hidden="true" role="status" aria-label="Loading">
		<img class="loading-gif" src="loading.gif" alt="">
	</div>
	<main class="sign-in-page">
		<section class="sign-in-panel" aria-labelledby="sign-in-heading">
			<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">Light mode</button>
			<p class="brand"></p>
			<h1 id="sign-in-heading"><a class="random-movie-logo" href="proto2.html?random=1" aria-label="Open a random movie">S-CoreBox<img class="logo-mark logo-dark" src="randominvert.png" alt=""><img class="logo-mark logo-light" src="random.png" alt=""></a></h1>
			<p class="subtitle">Find resources, or not. It's your <em>choice</em>.</p>

			<form action="proto2.html" method="get">
				<label class="form-field" for="email">
					Email
					<input id="email" name="email" type="email" autocomplete="email" required>
				</label>

				<label class="form-field" for="password">
					Password
					<input id="password" name="password" type="password" autocomplete="current-password" required>
				</label>

				<button class="submit-button" type="submit">Sign In</button>
			</form>
			<a class="back-link" href="proto2.html">Back to S-CoreBox</a>
		</section>
	</main>
	<script>
		const loadingScreen = document.querySelector('.loading-screen');
		const showLoadingScreen = () => loadingScreen.setAttribute('aria-hidden', 'false');
		const hideLoadingScreen = () => loadingScreen.setAttribute('aria-hidden', 'true');
		const transitionTo = (callback) => {
			showLoadingScreen();
			window.setTimeout(callback, 1300);
		};
		document.addEventListener('click', (event) => {
			const link = event.target.closest('a[href]');
			if (link && link.origin === window.location.origin && !link.target) {
				event.preventDefault();
				transitionTo(() => { window.location.href = link.href; });
			}
		}, true);
		document.addEventListener('submit', (event) => {
			event.preventDefault();
			transitionTo(() => { event.target.submit(); });
		}, true);

		const body = document.body;
		const themeToggle = document.getElementById('theme-toggle');
		const savedTheme = localStorage.getItem('s-corebox-theme') || 'dark';
		body.dataset.theme = savedTheme;

		const applyThemeLabel = () => {
			const isLight = body.dataset.theme === 'light';
			themeToggle.textContent = isLight ? 'Dark mode' : 'Light mode';
			themeToggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
		};

		applyThemeLabel();
		let themeTransitioning = false;
		themeToggle.addEventListener('click', () => {
			if (themeTransitioning) {
				return;
			}
			themeTransitioning = true;
			themeToggle.disabled = true;
			const nextTheme = body.dataset.theme === 'light' ? 'dark' : 'light';
			transitionTo(() => {
				body.dataset.theme = nextTheme;
				localStorage.setItem('s-corebox-theme', nextTheme);
				applyThemeLabel();
				hideLoadingScreen();
				themeToggle.disabled = false;
				themeTransitioning = false;
			});
		});
	</script>
</body>
</html>
