<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>S-CoreBox</title>
	<style>
		body {
			position: relative;
			margin: 0;
			background: #ffffff;
			color: #222;
			font-family: Arial, sans-serif;
		}

		.brand {
			position: absolute;
			top: calc(var(--frame-top) + 20px);
			right: calc(var(--frame-right) + 24px);
			font-size: 1.25rem;
			font-weight: bold;
		}

		.logo-mark {
			display: inline-block;
			width: 72px;
			height: 72px;
			margin-left: 10px;
			vertical-align: middle;
			object-fit: contain;
		}

		.logo-dark { display: inline-block; mix-blend-mode: screen; }
		.logo-light { display: none; mix-blend-mode: multiply; }
		.random-movie-logo {
			color: inherit;
			text-decoration: none;
		}
		body[data-theme="light"] .logo-dark { display: none; }
		body[data-theme="light"] .logo-light { display: inline-block; }

		button,
		.sign-in-button,
		.sign-up-button {
			min-height: 52px;
			box-sizing: border-box;
		}
		.account-actions {
			position: absolute;
			z-index: 3;
			top: calc(var(--frame-top) + 34px);
			right: calc(var(--frame-right) + 20px);
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 8px;
			padding: 0 8px;
		}

		.account-row {
			display: flex;
			gap: 8px;
		}

		.sign-in-button,
		.sign-up-button {
			position: relative;
			z-index: 3;
			padding: 10px 18px;
			border: 1px solid var(--auth-button-border, #000000);
			border-radius: 6px;
			background: var(--auth-button-bg, #000000);
			color: var(--auth-button-text, #ffffff);
			font: inherit;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
		}

		.sign-in-button:hover,
		.sign-in-button:focus-visible,
		.sign-up-button:hover,
		.sign-up-button:focus-visible {
			border-color: var(--auth-button-border-hover, #111111);
			background: var(--auth-button-bg-hover, #111111);
		}

		header {
			padding: 80px 24px 24px;
			border-bottom: 1px solid #e5e5e5;
		}

		.content-layout {
			display: block;
		}

		main {
			width: min(100%, 80%);
			margin: 0 auto;
			min-height: calc(100vh - 151px);
			padding: 32px 24px;
			box-sizing: border-box;
		}

		.main-actions {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: 12px;
			margin-bottom: 32px;
			align-items: stretch;
		}

		.filter-control {
			display: block;
			min-width: 0;
			height: 52px;
		}

		.main-actions select,
		.main-actions > button,
		.search-bar {
			flex: 1 1 0;
			min-width: 0;
			padding: 12px 20px;
			box-sizing: border-box;
			border: 0;
			border-radius: 0;
			background: transparent;
			color: #222;
			font: inherit;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
		}

		.main-actions select,
		.main-actions > button {
			height: 52px;
			width: 100%;
		}

		.main-actions select {
			width: 100%;
			flex: 0 0 auto;
			text-align: center;
		}

		.search-bar {
			grid-column: 1 / -1;
			width: 100%;
			flex: 0 0 auto;
			cursor: text;
		}

		.search-wrapper {
			position: relative;
			grid-column: 1 / -1;
		}

		.main-actions select option {
			text-align: center;
		}

		.main-actions select:hover,
		.main-actions select:focus-visible,
		.main-actions > button:hover,
		.main-actions > button:focus-visible,
		.search-bar:hover,
		.search-bar:focus-visible {
			border-color: #222;
		}

		.main-actions select:focus-visible,
		.main-actions > button:focus-visible {
			outline: none;
		}

		.main-actions select:hover {
			background: #f1f1f1;
		}

		.main-actions button[aria-pressed="true"] {
			border-color: #222;
			background: #222;
			color: #ffffff;
		}

		.theme-toggle {
			padding: 9px 14px;
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.04);
			color: #f5f5f5;
			font: inherit;
			cursor: pointer;
			transition: opacity 160ms ease, border-color 160ms ease, background-color 160ms ease;
		}

		.theme-toggle:hover,
		.theme-toggle:focus-visible {
			border-color: rgba(255, 255, 255, 0.28);
			background: rgba(255, 255, 255, 0.09);
		}

		.mock-data-box {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 18px;
			max-height: none;
			overflow: visible;
			padding: 12px 0;
			border: 0;
			border-radius: 0;
		}

		.movie-row {
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			overflow: visible;
			background: rgba(255, 255, 255, 0.02);
		}

		.movie-review-preview {
			position: absolute;
			z-index: 2;
			left: 20px;
			top: calc(100% + 8px);
			width: min(520px, calc(100% - 40px));
			padding: 14px 16px;
			border: 1px solid #cfcfcf;
			background: #ffffff;
			box-shadow: 0 8px 20px rgb(0 0 0 / 14%);
			color: #333;
			font-size: 0.9rem;
			line-height: 1.5;
			pointer-events: none;
		}

		.movie-poster {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 300px;
			padding: 0;
			background: linear-gradient(160deg, #2d2d2d, #0d0d0d 70%);
			color: #ffffff;
			overflow: hidden;
		}

		.movie-poster-image {
			width: 100%;
			height: 100%;
			min-height: 300px;
			object-fit: cover;
		}

		.movie-poster::after {
			position: absolute;
			inset: 45% 0 0;
			background: linear-gradient(transparent, rgb(0 0 0 / 85%));
			content: "";
			pointer-events: none;
		}

		.movie-poster-tag {
			position: absolute;
			z-index: 1;
			top: 12px;
			left: 12px;
			display: inline-flex;
			align-self: flex-start;
			padding: 4px 8px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.12);
			font-size: 0.63rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.movie-poster-title {
			position: absolute;
			z-index: 1;
			bottom: 12px;
			left: 12px;
			right: 12px;
			display: block;
			font-size: 1.2rem;
			font-weight: bold;
			line-height: 1.2;
		}

		.movie-poster-id {
			position: absolute;
			z-index: 1;
			top: 12px;
			right: 12px;
			padding: 4px 8px;
			border-radius: 999px;
			background: rgb(0 0 0 / 65%);
			font-size: 0.75rem;
		}

		.movie-button {
			display: block;
			padding: 14px 14px 10px;
			border: 0;
			background: transparent;
			color: var(--text);
			font: inherit;
			font-weight: bold;
			text-align: left;
			text-decoration: none;
			transition: background-color 160ms ease;
		}

		.bookmark-button {
			width: 100%;
			padding: 10px 12px 14px;
			border: 0;
			border-top: 1px solid rgba(255, 255, 255, 0.06);
			background: transparent;
			color: var(--text);
			font: inherit;
			cursor: pointer;
		}

		.bookmark-button:hover,
		.bookmark-button:focus-visible,
		.bookmark-button[aria-pressed="true"] {
			background: #dedede;
		}

		.movie-button:hover,
		.movie-button:focus-visible {
			background: #dedede;
		}

		.movie-rating {
			display: flex;
			align-items: center;
			padding: 12px 16px;
			border-left: 1px solid #e5e5e5;
			color: #555;
			font-weight: bold;
			white-space: nowrap;
		}

		.movie-button[hidden] {
			display: none;
		}

		.movie-row[hidden] {
			display: none !important;
		}

		.movie-row:last-child {
			border-bottom: 0;
		}

		.pagination-controls {
			display: flex;
			gap: 12px;
			margin-top: 12px;
		}

		.pagination-button {
			flex: 1;
			padding: 12px 20px;
			border: 1px solid #cfcfcf;
			border-radius: 6px;
			background: #ffffff;
			color: #222;
			font: inherit;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease;
		}

		.pagination-button:hover:not(:disabled),
		.pagination-button:focus-visible:not(:disabled) {
			border-color: #222;
			background: #dedede;
		}

		.pagination-button:disabled {
			cursor: not-allowed;
			opacity: 0.5;
		}

		.pagination-controls[hidden] {
			display: none;
		}

		.movie-details-backdrop {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: rgb(0 0 0 / 40%);
		}

		.movie-details-backdrop[hidden] {
			display: none;
		}

		.movie-details-template {
			width: min(100%, 520px);
			box-sizing: border-box;
			padding: 28px;
			border: 1px solid #cfcfcf;
			border-radius: 6px;
			background: #ffffff;
			box-shadow: 0 12px 30px rgb(0 0 0 / 18%);
		}

		.movie-details-template h2 {
			margin: 0 0 20px;
		}

		.movie-details-template p {
			margin: 0 0 16px;
		}

		.movie-details-template a {
			color: #222;
			word-break: break-all;
		}

		.movie-details-genres {
			color: #555;
		}

		.close-details-button {
			width: 100%;
			padding: 12px 20px;
			border: 1px solid #222;
			border-radius: 6px;
			background: #222;
			color: #ffffff;
			font: inherit;
			cursor: pointer;
		}

		.close-details-button:hover,
		.close-details-button:focus-visible {
			background: #444;
		}

		@media (max-width: 760px) {
			body {
				padding: 24px 12px;
			}

			body::before {
				background-size: cover;
				opacity: 0.45;
			}

			.account-actions {
				position: relative;
				top: auto;
				right: auto;
				align-items: stretch;
				margin-bottom: 20px;
				padding: 0;
			}

			.account-row {
				width: 100%;
			}

			.sign-in-button,
			.sign-up-button,
			.theme-toggle {
				flex: 1;
				text-align: center;
			}

			header {
				padding: 24px 0;
			}

			header h1 {
				margin: 0;
				font-size: clamp(2rem, 11vw, 3rem);
			}

			.logo-mark {
				width: 52px;
				height: 52px;
			}

			main {
				width: 100%;
				padding: 20px 0;
			}

			.main-actions {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 8px;
				margin-bottom: 20px;
			}

			.main-actions select,
			.main-actions > button,
			.search-bar {
				min-height: 48px;
				padding: 10px 8px;
				font-size: 0.9rem;
			}

			.mock-data-box {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
				padding-top: 4px;
			}

			.movie-poster,
			.movie-poster-image {
				min-height: 220px;
			}

			.movie-poster-title {
				font-size: 0.95rem;
			}

			.movie-poster-tag,
			.movie-poster-id {
				top: 8px;
				font-size: 0.6rem;
			}

			.movie-poster-tag {
				left: 8px;
			}

			.movie-poster-id {
				right: 8px;
			}

			.movie-button {
				padding: 10px 8px 8px;
				font-size: 0.9rem;
			}

			.bookmark-button {
				padding: 9px 6px 11px;
				font-size: 0.8rem;
			}

			.content-layout {
				display: block;
			}

			.featured-films {
				padding: 0 24px 32px;
			}
		}

		@media (max-width: 420px) {
			body {
				padding-inline: 8px;
			}

			.main-actions {
				grid-template-columns: 1fr;
			}

			.search-wrapper {
				grid-column: auto;
			}

			.mock-data-box {
				gap: 8px;
			}

			.movie-poster,
			.movie-poster-image {
				min-height: 190px;
			}
		}

		:root {
			color-scheme: dark;
			--bg: #050505;
			--bg-elevated: #111111;
			--panel: #171717;
			--panel-strong: #1f1f1f;
			--text: #f5f5f5;
			--muted: #c7c7c7;
			--border: rgba(255, 255, 255, 0.12);
			--button-bg: #ffffff;
			--button-text: #111111;
			--shadow: rgb(0 0 0 / 40%);
			--auth-button-bg: #000000;
			--auth-button-bg-hover: #111111;
			--auth-button-text: #ffffff;
			--auth-button-border: #000000;
			--auth-button-border-hover: #111111;
			--theme-frame-image: url("console.png");
			--frame-top: 5vh;
			--frame-right: 16vw;
			--frame-bottom: 5vh;
			--frame-left: 16vw;
		}

		body {
			background: var(--bg);
			color: var(--text);
			box-sizing: border-box;
			min-height: 100vh;
			padding: var(--frame-top) var(--frame-right) var(--frame-bottom) var(--frame-left);
		}

		body[data-theme="light"] {
			color-scheme: light;
			--bg: #f5f5f5;
			--bg-elevated: #ffffff;
			--panel: #ffffff;
			--panel-strong: #f0f0f0;
			--text: #111111;
			--muted: #555555;
			--border: rgba(17, 17, 17, 0.38);
			--button-bg: #111111;
			--button-text: #ffffff;
			--shadow: rgb(0 0 0 / 12%);
			--auth-button-bg: #ffffff;
			--auth-button-bg-hover: #f3f3f3;
			--auth-button-text: #111111;
			--auth-button-border: rgba(17, 17, 17, 0.38);
			--auth-button-border-hover: rgba(17, 17, 17, 0.52);
			--theme-frame-image: url("tbdf.png");
			--frame-right: 16vw;
			--frame-left: 16vw;
		}

		body::before {
			position: fixed;
			z-index: 2;
			inset: 0;
			background: var(--theme-frame-image) center / 100% 100% no-repeat;
			content: "";
			pointer-events: none;
		}

		body[data-theme="light"]::before {
			z-index: 2;
			opacity: 0.9;
		}

		body > * {
			position: relative;
			z-index: 1;
		}

		button,
		select,
		input,
		a,
		.movie-row {
			pointer-events: auto;
		}

		body[data-theme="dark"] .sign-in-button,
		body[data-theme="dark"] .sign-up-button,
		body[data-theme="dark"] .theme-toggle,
		body[data-theme="dark"] .main-actions > button,
		body[data-theme="dark"] .main-actions select,
		body[data-theme="dark"] .search-bar,
		body[data-theme="dark"] .movie-button,
		body[data-theme="dark"] .bookmark-button,
		body[data-theme="dark"] .pagination-button,
		body[data-theme="dark"] .close-details-button {
			background: #000000;
			color: #ffffff;
			border-color: #000000;
		}

		body[data-theme="dark"] .sign-in-button:hover,
		body[data-theme="dark"] .sign-in-button:focus-visible,
		body[data-theme="dark"] .sign-up-button:hover,
		body[data-theme="dark"] .sign-up-button:focus-visible,
		body[data-theme="dark"] .theme-toggle:hover,
		body[data-theme="dark"] .theme-toggle:focus-visible,
		body[data-theme="dark"] .main-actions > button:hover,
		body[data-theme="dark"] .main-actions > button:focus-visible,
		body[data-theme="dark"] .main-actions select:hover,
		body[data-theme="dark"] .main-actions select:focus-visible,
		body[data-theme="dark"] .search-bar:hover,
		body[data-theme="dark"] .search-bar:focus-visible,
		body[data-theme="dark"] .movie-button:hover,
		body[data-theme="dark"] .movie-button:focus-visible,
		body[data-theme="dark"] .bookmark-button:hover,
		body[data-theme="dark"] .bookmark-button:focus-visible,
		body[data-theme="dark"] .pagination-button:hover:not(:disabled),
		body[data-theme="dark"] .pagination-button:focus-visible:not(:disabled),
		body[data-theme="dark"] .close-details-button:hover,
		body[data-theme="dark"] .close-details-button:focus-visible {
			background: #000000;
			border-color: #000000;
			color: #ffffff;
		}

		body[data-theme="light"] .sign-in-button,
		body[data-theme="light"] .sign-up-button {
			background: #ffffff;
			color: #111111;
			border-color: rgba(17, 17, 17, 0.38);
		}

		body[data-theme="light"] .sign-in-button:hover,
		body[data-theme="light"] .sign-in-button:focus-visible,
		body[data-theme="light"] .sign-up-button:hover,
		body[data-theme="light"] .sign-up-button:focus-visible {
			background: #f3f3f3;
			border-color: rgba(17, 17, 17, 0.52);
		}

		body[data-theme="light"] .theme-toggle {
			border-color: rgba(17, 17, 17, 0.38);
			background: rgba(0, 0, 0, 0.03);
			color: #111111;
		}

		body[data-theme="light"] .theme-toggle:hover,
		body[data-theme="light"] .theme-toggle:focus-visible {
			background: rgba(0, 0, 0, 0.06);
		}

		body[data-theme="light"] .main-actions select,
		body[data-theme="light"] .main-actions > button,
		body[data-theme="light"] .search-bar,
		body[data-theme="light"] .movie-button,
		body[data-theme="light"] .bookmark-button,
		body[data-theme="light"] .movie-review-preview,
		body[data-theme="light"] .pagination-button,
		body[data-theme="light"] .featured-film,
		body[data-theme="light"] .mock-data-box,
		body[data-theme="light"] .movie-details-template {
			background: var(--panel);
			color: var(--text);
			border-color: var(--border);
		}

		body[data-theme="light"] .movie-review-preview {
			box-shadow: 0 8px 20px rgb(0 0 0 / 10%);
		}

		.main-actions select,
		.main-actions > button,
		.search-bar,
		.movie-button,
		.bookmark-button,
		.movie-review-preview,
		.pagination-button,
		.featured-film,
		.mock-data-box,
		.movie-details-template {
			background: var(--panel);
			color: var(--text);
			border-color: var(--border);
		}

		.loading-screen {
			position: fixed;
			z-index: 10;
			inset: 0;
			display: grid;
			place-items: center;
			background: #ffffff;
			color: #111111;
			opacity: 0;
			pointer-events: none;
			transition: opacity 160ms ease;
		}

		.loading-screen[aria-hidden="false"] {
			opacity: 1;
			pointer-events: auto;
		}

		.loading-gif {
			width: min(260px, 40vw);
			height: auto;
			object-fit: contain;
		}
	</style>
</head>
<body>
	<div class="loading-screen" aria-hidden="true" role="status" aria-label="Loading">
		<img class="loading-gif" src="loading.gif" alt="">
	</div>
	<div class="brand"></div>
	<nav class="account-actions" aria-label="Account actions">
		<div class="account-row">
			<a class="sign-in-button" href="signin.html">Sign In</a>
			<a class="sign-up-button" href="signup.html">Sign Up</a>
		</div>
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">Light mode</button>
	</nav>

	<header>
		<h1><a class="random-movie-logo" href="proto2.html?random=1" aria-label="Open a random movie">S-CoreBox<img class="logo-mark logo-dark" src="randominvert.png" alt=""><img class="logo-mark logo-light" src="random.png" alt=""></a></h1>
	</header>

	<div class="content-layout">
	<main>
		<div class="main-actions" role="group" aria-label="Content controls">
			<div class="filter-control">
				<select aria-label="Filter by genre">
					<option value="all">Genres</option>
					<option value="Action">Action</option>
					<option value="Adult">Adult</option>
					<option value="Adventure">Adventure</option>
					<option value="Animation">Animation</option>
					<option value="Biography">Biography</option>
					<option value="Comedy">Comedy</option>
					<option value="Crime">Crime</option>
					<option value="Documentary">Documentary</option>
					<option value="Drama">Drama</option>
					<option value="Family">Family</option>
					<option value="Fantasy">Fantasy</option>
					<option value="Film-Noir">Film-Noir</option>
					<option value="Game-Show">Game-Show</option>
					<option value="History">History</option>
					<option value="Horror">Horror</option>
					<option value="Music">Music</option>
					<option value="Musical">Musical</option>
					<option value="Mystery">Mystery</option>
					<option value="News">News</option>
					<option value="Reality-TV">Reality-TV</option>
					<option value="Romance">Romance</option>
					<option value="Sci-Fi">Sci-Fi</option>
					<option value="Short">Short</option>
					<option value="Sport">Sport</option>
					<option value="Talk-Show">Talk-Show</option>
					<option value="Thriller">Thriller</option>
					<option value="War">War</option>
					<option value="Western">Western</option>
				</select>
			</div>
			<div class="filter-control">
				<select id="rating-category-filter" aria-label="Filter by rating category">
					<option value="all">Ratings</option>
					<option value="mise-en-scene">Mise-en-scène</option>
					<option value="cinematography">Cinematography</option>
					<option value="narrative">Narrative</option>
					<option value="sound">Sound</option>
					<option value="editing">Editing</option>
				</select>
			</div>
			<div class="filter-control">
				<select id="rating-grade-filter" aria-label="Filter by minimum rating grade">
					<option value="all">Grades</option>
					<option value="F">F or higher</option>
					<option value="E">E or higher</option>
					<option value="D">D or higher</option>
					<option value="C">C or higher</option>
					<option value="B">B or higher</option>
					<option value="A">A or higher</option>
					<option value="S">S or higher</option>
					<option value="Z">Z or higher</option>
					<option value="Z+">Z+ only</option>
				</select>
			</div>
			<button type="button" aria-pressed="false" data-sort-direction="sort">Sort</button>
			<button type="button" aria-pressed="false" data-bookmarks-filter>Watch Later</button>
			<div class="search-wrapper">
				<input class="search-bar" type="search" aria-label="Search movies" aria-controls="mock-data-box" placeholder="Search movies...">
			</div>
		</div>

		<div id="mock-data-box" class="mock-data-box" aria-label="Movie data"></div>
		<div id="pagination-controls" class="pagination-controls" aria-label="Movie list pagination">
			<button id="previous-page-button" class="pagination-button" type="button" aria-controls="mock-data-box">Back</button>
			<button id="next-page-button" class="pagination-button" type="button" aria-controls="mock-data-box">Next</button>
		</div>
	</main>
	</div>

	<div id="movie-details-backdrop" class="movie-details-backdrop" role="presentation" hidden>
		<section class="movie-details-template" role="dialog" aria-modal="true" aria-labelledby="movie-details-title">
			<h2 id="movie-details-title"></h2>
			<p><strong>IMDb:</strong> <a id="movie-details-link" target="_blank" rel="noopener noreferrer"></a></p>
			<p><strong>Genres:</strong> <span id="movie-details-genres" class="movie-details-genres"></span></p>
			<button id="close-details-button" class="close-details-button" type="button">Close</button>
		</section>
	</div>

	<script>
		const loadingScreen = document.querySelector('.loading-screen');
		const showLoadingScreen = () => loadingScreen.setAttribute('aria-hidden', 'false');
		const hideLoadingScreen = () => loadingScreen.setAttribute('aria-hidden', 'true');
		const transitionTo = (callback) => {
			showLoadingScreen();
			window.setTimeout(callback, 1300);
		};
		document.addEventListener('click', (event) => {
			const link = event.target.closest('a[href]');
			if (link?.classList.contains('random-movie-logo') && movies.length) {
				event.preventDefault();
				const randomMovie = movies[Math.floor(Math.random() * movies.length)];
				transitionTo(() => {
					window.location.href = `movie.html?id=${encodeURIComponent(randomMovie.id)}`;
				});
				return;
			}
			if (link && link.origin === window.location.origin && !link.target) {
				event.preventDefault();
				transitionTo(() => { window.location.href = link.href; });
			}
		}, true);
		document.addEventListener('submit', (event) => {
			event.preventDefault();
			transitionTo(() => { event.target.submit(); });
		}, true);

		const body = document.body;
		const themeToggle = document.getElementById('theme-toggle');
		const savedTheme = localStorage.getItem('s-corebox-theme') || 'dark';
		body.dataset.theme = savedTheme;

		const syncThemeVariables = () => {
			const isLight = body.dataset.theme === 'light';
			document.documentElement.style.setProperty('--auth-button-bg', isLight ? '#ffffff' : '#000000');
			document.documentElement.style.setProperty('--auth-button-text', isLight ? '#111111' : '#ffffff');
			document.documentElement.style.setProperty('--auth-button-border', isLight ? 'rgba(0, 0, 0, 0.12)' : '#000000');
			document.documentElement.style.setProperty('--auth-button-bg-hover', isLight ? '#f3f3f3' : '#111111');
			document.documentElement.style.setProperty('--auth-button-border-hover', isLight ? 'rgba(0, 0, 0, 0.2)' : '#111111');
			body.style.setProperty('--auth-button-bg', isLight ? '#ffffff' : '#000000');
			body.style.setProperty('--auth-button-text', isLight ? '#111111' : '#ffffff');
			body.style.setProperty('--auth-button-border', isLight ? 'rgba(0, 0, 0, 0.12)' : '#000000');
			body.style.setProperty('--auth-button-bg-hover', isLight ? '#f3f3f3' : '#111111');
			body.style.setProperty('--auth-button-border-hover', isLight ? 'rgba(0, 0, 0, 0.2)' : '#111111');

			document.querySelectorAll('.sign-in-button, .sign-up-button').forEach((button) => {
				button.style.setProperty('background', isLight ? '#ffffff' : '#000000', 'important');
				button.style.setProperty('color', isLight ? '#111111' : '#ffffff', 'important');
				button.style.setProperty('border-color', isLight ? 'rgba(0, 0, 0, 0.12)' : '#000000', 'important');
			});
		};

		const applyThemeLabel = () => {
			const isLight = body.dataset.theme === 'light';
			themeToggle.textContent = isLight ? 'Dark mode' : 'Light mode';
			themeToggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
			syncThemeVariables();
		};

		applyThemeLabel();
		let themeTransitioning = false;
		themeToggle.addEventListener('click', () => {
			if (themeTransitioning) {
				return;
			}
			themeTransitioning = true;
			themeToggle.disabled = true;
			const nextTheme = body.dataset.theme === 'light' ? 'dark' : 'light';
			transitionTo(() => {
				body.dataset.theme = nextTheme;
				localStorage.setItem('s-corebox-theme', nextTheme);
				document.querySelectorAll('.sign-in-button, .sign-up-button').forEach((button) => {
					button.style.setProperty('background', nextTheme === 'light' ? '#ffffff' : '#000000', 'important');
					button.style.setProperty('color', nextTheme === 'light' ? '#111111' : '#ffffff', 'important');
					button.style.setProperty('border-color', nextTheme === 'light' ? 'rgba(0, 0, 0, 0.12)' : '#000000', 'important');
				});
				applyThemeLabel();
				hideLoadingScreen();
				themeToggle.disabled = false;
				themeTransitioning = false;
			});
		});

		const mockDataBox = document.getElementById('mock-data-box');
		const searchBar = document.querySelector('.search-bar');
		const genreFilter = document.querySelector('.filter-control select');
		const ratingCategoryFilter = document.getElementById('rating-category-filter');
		const ratingGradeFilter = document.getElementById('rating-grade-filter');
		const bookmarksFilterButton = document.querySelector('[data-bookmarks-filter]');
		const paginationControls = document.getElementById('pagination-controls');
		const previousPageButton = document.getElementById('previous-page-button');
		const nextPageButton = document.getElementById('next-page-button');
		const pageSize = 50;
		let currentPage = 0;
		let movies = [];

		const updateRatingFilterVisibility = () => {
			const showRatingFilters = genreFilter.value === 'all';
			ratingCategoryFilter.closest('.filter-control').hidden = !showRatingFilters;
			ratingGradeFilter.closest('.filter-control').hidden = !showRatingFilters;
			if (!showRatingFilters) {
				ratingCategoryFilter.value = 'all';
				ratingGradeFilter.value = 'all';
			}
		};

		const renderMovies = (movies) => {
			movies.forEach((movie) => {
			const movieRow = document.createElement('div');
			movieRow.className = 'movie-row';
			movieRow.setAttribute('role', 'link');
			movieRow.setAttribute('tabindex', '0');
			movieRow.style.cursor = 'pointer';
			movieRow.dataset.movieId = movie.id;
			movieRow.dataset.genres = JSON.stringify(movie.genres);
			movieRow.dataset.ratings = JSON.stringify(movie.reviews.ratings);
			const imdbId = movie.movie_url.match(/\/title\/(tt\d+)/i)?.[1];

			const poster = document.createElement('div');
			poster.className = 'movie-poster';
			poster.innerHTML = `
				<img class="movie-poster-image" src="https://images.metahub.space/poster/medium/${imdbId || ''}/img" alt="Poster for ${movie.title}" loading="lazy">
				<span class="movie-poster-tag">${movie.genres[0] || 'Movie'}</span>
				<span class="movie-poster-id">ID: ${movie.id}</span>
				<span class="movie-poster-title">${movie.title}</span>
			`;
			poster.querySelector('.movie-poster-image').addEventListener('error', (event) => {
				event.target.hidden = true;
			});

			const movieButton = document.createElement('button');
			movieButton.type = 'button';
			movieButton.className = 'movie-button';
			movieButton.textContent = `${movie.title} · ${movie.rating}`;
			movieButton.dataset.movieId = movie.id;
			movieButton.dataset.movieUrl = movie.movie_url;
			const openMovie = () => {
				transitionTo(() => {
					window.location.href = `movie.html?id=${encodeURIComponent(movie.id)}`;
				});
			};
			movieRow.addEventListener('click', (event) => {
				if (event.target.closest('.bookmark-button')) {
					return;
				}
				openMovie();
			});
			movieRow.addEventListener('keydown', (event) => {
				if (event.key === 'Enter' || event.key === ' ') {
					event.preventDefault();
					openMovie();
				}
			});
			let reviewPreviewTimer;
			movieRow.addEventListener('mouseenter', () => {
				reviewPreviewTimer = window.setTimeout(() => {
					const reviewPreview = document.createElement('div');
					reviewPreview.className = 'movie-review-preview';
					reviewPreview.textContent = movie.reviews.final_review;
					movieRow.appendChild(reviewPreview);
				}, 500);
			});
			movieRow.addEventListener('mouseleave', () => {
				window.clearTimeout(reviewPreviewTimer);
				movieRow.querySelector('.movie-review-preview')?.remove();
			});

			const rating = document.createElement('span');
			rating.className = 'movie-rating';
			rating.innerHTML = `&#9733; ${movie.rating}`;
			rating.setAttribute('aria-label', `Rating ${movie.rating} out of 10`);
			rating.hidden = true;

			const bookmarkButton = document.createElement('button');
			bookmarkButton.type = 'button';
			bookmarkButton.className = 'bookmark-button';
			bookmarkButton.setAttribute('aria-pressed', 'false');
			bookmarkButton.textContent = 'Watch Later';
			bookmarkButton.addEventListener('click', () => {
				const isBookmarked = bookmarkButton.getAttribute('aria-pressed') === 'true';
				bookmarkButton.setAttribute('aria-pressed', String(!isBookmarked));
				bookmarkButton.textContent = isBookmarked ? 'Watch Later' : 'Saved';
				filterMovies(searchBar.value);
			});

			movieRow.append(poster, movieButton, bookmarkButton);
			mockDataBox.appendChild(movieRow);
		});
		};

		let movieRows = [];

		const sortMovies = (direction) => {
			const sortedRows = [...movieRows].sort((firstRow, secondRow) => {
				const firstNumber = Number(firstRow.dataset.movieId);
				const secondNumber = Number(secondRow.dataset.movieId);
				return direction === 'ascending' ? firstNumber - secondNumber : secondNumber - firstNumber;
			});

			sortedRows.forEach((movieRow) => mockDataBox.appendChild(movieRow));
		};


		fetch('output_updated_reviews_filled.json')
			.then((response) => {
				if (!response.ok) {
					throw new Error(`Unable to load movies: ${response.status}`);
				}
				return response.json();
			})
			.then((movieCatalog) => {
				movies = movieCatalog;
				renderMovies(movieCatalog);
				document.querySelectorAll('[data-featured-id]').forEach((featuredFilm) => {
					const movie = movieCatalog.find((item) => String(item.id) === featuredFilm.dataset.featuredId);
					if (!movie) {
						return;
					}
					featuredFilm.querySelector('.featured-film-title').textContent = movie.title;
					featuredFilm.querySelector('.featured-film-rating').textContent = `★ ${movie.rating}`;
					featuredFilm.querySelector('img').alt = movie.title;
				});
				movieRows = [...mockDataBox.querySelectorAll('.movie-row')];
				filterMovies(searchBar.value);
				if (new URLSearchParams(window.location.search).get('random') === '1' && movies.length) {
					const randomMovie = movies[Math.floor(Math.random() * movies.length)];
					transitionTo(() => {
						window.location.href = `movie.html?id=${encodeURIComponent(randomMovie.id)}`;
					});
				}
			})
			.catch((error) => {
				mockDataBox.textContent = error.message;
			});
		const gradeRanks = { F: 0, E: 1, D: 2, C: 3, B: 4, A: 5, S: 6, Z: 7, 'Z+': 8 };

		const filterMovies = (searchTerm, selectedGenre = genreFilter.value) => {
			const normalizedSearchTerm = searchTerm.trim().toLowerCase();
			const bookmarksOnly = bookmarksFilterButton.getAttribute('aria-pressed') === 'true';
			const selectedCategory = ratingCategoryFilter.value;
			const selectedGrade = ratingGradeFilter.value;
			const isPaginated = !normalizedSearchTerm && selectedGenre === 'all' && selectedCategory === 'all' && selectedGrade === 'all' && !bookmarksOnly;
			const pageStart = currentPage * pageSize;
			const pageEnd = pageStart + pageSize;

			movieRows.forEach((movieRow, index) => {
				const movieTitle = movieRow.querySelector('.movie-button').textContent.trim().toLowerCase();
				const matchesSearch = movieTitle.includes(normalizedSearchTerm);
				const matchesGenre = selectedGenre === 'all' || JSON.parse(movieRow.dataset.genres).includes(selectedGenre);
				const ratings = JSON.parse(movieRow.dataset.ratings);
				const ratingValues = selectedCategory === 'all' ? Object.values(ratings) : [ratings[selectedCategory]];
				const matchesRating = selectedGrade === 'all' || ratingValues.some((rating) => gradeRanks[rating] >= gradeRanks[selectedGrade]);
				const isBookmarked = movieRow.querySelector('.bookmark-button').getAttribute('aria-pressed') === 'true';
				const isOutsidePage = isPaginated && (index < pageStart || index >= pageEnd);
				movieRow.hidden = !matchesSearch || !matchesGenre || !matchesRating || (bookmarksOnly && !isBookmarked) || isOutsidePage;
			});

			paginationControls.hidden = !isPaginated;
			previousPageButton.disabled = currentPage === 0;
			nextPageButton.disabled = !isPaginated || pageEnd >= movieRows.length;
		};

		searchBar.addEventListener('input', () => filterMovies(searchBar.value));
		genreFilter.addEventListener('change', () => {
			updateRatingFilterVisibility();
			filterMovies(searchBar.value);
		});
		ratingCategoryFilter.addEventListener('change', () => filterMovies(searchBar.value));
		ratingGradeFilter.addEventListener('change', () => filterMovies(searchBar.value));
		updateRatingFilterVisibility();
		previousPageButton.addEventListener('click', () => {
			if (currentPage === 0) {
				return;
			}

			currentPage -= 1;
			filterMovies(searchBar.value);
		});
		nextPageButton.addEventListener('click', () => {
			if ((currentPage + 1) * pageSize >= movieRows.length) {
				return;
			}

			currentPage += 1;
			filterMovies(searchBar.value);
		});
		document.querySelectorAll('.main-actions button').forEach((button) => {
			button.addEventListener('click', () => {
				if (button.dataset.sortDirection) {
					if (button.dataset.sortDirection === 'sort') {
						button.dataset.sortDirection = 'ascending';
						button.setAttribute('aria-pressed', 'true');
						button.textContent = 'Ascending ↑';
						sortMovies('ascending');
						return;
					}

					const isAscending = button.dataset.sortDirection === 'ascending';
					const nextDirection = isAscending ? 'descending' : 'ascending';
					button.dataset.sortDirection = nextDirection;
					button.textContent = isAscending ? 'Descending ↓' : 'Ascending ↑';
					sortMovies(nextDirection);
					return;
				}

				const isSelected = button.getAttribute('aria-pressed') === 'true';
				button.setAttribute('aria-pressed', String(!isSelected));

				if (button === bookmarksFilterButton) {
					filterMovies(searchBar.value);
				}
			});
		});

	</script>
</body>
</html>
